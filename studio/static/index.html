<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLM Agent Studio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  :root{
    /* AI-Native light theme — neutral surfaces + AI purple accent */
    --bg:#F5F6FA; --panel:#FFFFFF; --panel2:#F1F2F8; --border:#E5E6F0;
    --text:#1E1B4B; --muted:#6B7280; --accent:#7C3AED; --accent-soft:#EDE9FE;
    --accent2:#059669; --danger:#DC2626; --warn:#B45309; --radius:12px;
    --shadow:0 1px 2px rgba(30,27,75,.04), 0 1px 3px rgba(30,27,75,.07);
    --shadow-lg:0 4px 12px rgba(30,27,75,.08), 0 2px 4px rgba(30,27,75,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;height:100vh;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
  aside{width:236px;background:var(--panel);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
  .brand{font-size:17px;font-weight:700;margin-bottom:2px}
  .brand span{color:var(--accent)}
  .brand-sub{font-size:11px;color:var(--muted);margin-bottom:18px}
  .nav-item{padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;transition:background .15s,color .15s}
  .nav-item:hover{background:var(--panel2);color:var(--text)}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  main{flex:1;overflow-y:auto;padding:28px 36px}
  h1{font-size:20px;margin-bottom:4px}
  .sub{color:var(--muted);margin-bottom:24px;font-size:13px}
  .row{display:flex;gap:12px;align-items:center}
  .grow{flex:1}
  button{background:var(--accent);border:none;color:#fff;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;box-shadow:0 1px 2px rgba(124,58,237,.25);transition:filter .15s,box-shadow .15s}
  button:hover{filter:brightness(1.08);box-shadow:0 2px 6px rgba(124,58,237,.3)}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  button.green{background:var(--accent2)}
  button.danger-ghost{background:transparent;border:1px solid var(--border);color:var(--danger)}
  button.small{padding:4px 10px;font-size:12px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s,transform .15s}
  .card:hover{border-color:var(--accent);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
  .card h3{font-size:15px;margin-bottom:4px}
  .card p{color:var(--muted);font-size:12.5px;min-height:36px}
  .meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .chip{background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:2px 10px;font-size:11px;color:var(--muted)}
  .chip.blue{color:var(--accent);border-color:#DDD6FE;background:var(--accent-soft)}
  .chip.green{color:var(--accent2);border-color:#A7F3D0;background:#ECFDF5}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:18px 0 22px}
  .tab{padding:8px 16px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .panel h3{font-size:14px;margin-bottom:12px}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:600}
  input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 11px;font:13px "Segoe UI",system-ui,sans-serif}
  textarea{resize:vertical;font-family:Consolas,monospace;font-size:12.5px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 20px}
  .model-opt{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer}
  .model-opt:hover{border-color:var(--accent)}
  .model-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .model-opt .name{font-weight:600;font-size:13px}
  .model-opt .info{color:var(--muted);font-size:11.5px;margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;padding:6px 10px;border-bottom:1px solid var(--border)}
  td{padding:9px 10px;border-bottom:1px solid var(--border)}
  .drop{border:2px dashed var(--border);border-radius:var(--radius);padding:30px;text-align:center;color:var(--muted);cursor:pointer}
  .drop.over{border-color:var(--accent);color:var(--accent)}
  .result{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:10px;font-size:12.5px}
  .result .score{color:var(--accent2);font-weight:600;font-size:11px}
  .result .src{color:var(--muted);font-size:11px;margin-bottom:5px}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--panel);border:1px solid var(--accent);color:var(--text);padding:12px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;z-index:99;max-width:420px;box-shadow:var(--shadow-lg)}
  .toast.show{opacity:1}
  .toast.err{border-color:var(--danger)}
  .empty{color:var(--muted);text-align:center;padding:40px 0;font-size:13px}
  .back{color:var(--accent);cursor:pointer;font-size:13px;margin-bottom:10px;display:inline-block}
  .tool-card{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;background:var(--bg)}
  .tool-card .tname{font-weight:600;font-family:Consolas,monospace;font-size:13px;color:var(--accent)}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  code{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<aside>
  <div class="brand">⬡ Agent <span>Studio</span></div>
  <div class="brand-sub">Offline Enterprise Agent Runtime</div>
  <div class="nav-item active" data-view="agents" onclick="nav('agents')">Agents</div>
  <div class="nav-item" data-view="published" onclick="nav('published')">Published Bundles</div>
  <div class="nav-item" data-view="models" onclick="nav('models')">Model Catalog</div>
  <div class="nav-item" data-view="governance" onclick="nav('governance')">Governance</div>
  <a class="nav-item" href="/welcome" style="margin-top:auto;color:var(--accent);font-weight:600" title="Platform landing page">✦ Platform home</a>
</aside>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const api = async (path, opts = {}) => {
  if (opts.json) { opts.body = JSON.stringify(opts.json); opts.headers = {'Content-Type':'application/json'}; delete opts.json; }
  const r = await fetch(path, opts);
  if (!r.ok) { let d; try { d = (await r.json()).detail; } catch { d = r.statusText; } throw new Error(d); }
  return r.json();
};
const esc = (s) => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastTimer;
function toast(msg, err = false) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast', 3500);
}

const MEETING_TEMPLATE = `You are the Meeting Intelligence Agent — a private, on-device copilot for delivery managers, project managers, and solution architects.

You have access to a knowledge base containing this user's meeting minutes, project status reports, customer profiles, risk registers, and decision logs. Context passages retrieved from it are provided with each question.

Your job:
- BEFORE meetings: brief the user — agenda, previous minutes, open action items, stakeholder context, risks.
- DURING meetings: answer factual questions instantly from the knowledge base; identify commitments being made.
- AFTER meetings: draft minutes of meeting (MOM), action item lists, and follow-up emails.

Rules:
- Answer ONLY from the provided context. If the context does not contain the answer, say "I don't have that in the knowledge base" — never invent facts, names, dates, or commitments.
- Cite the source document name when you state a fact.
- Be concise: the user is on a phone between meetings and needs answers in under 10 seconds.
- Format lists as short bullet points. Lead with the direct answer.`;

const TOOL_TEMPLATES = [
  { name:'create_action_item', kind:'builtin', description:'Create an action item / task on the device. Stored locally and synced when online.',
    parameters:{type:'object',properties:{title:{type:'string',description:'Action item title'},owner:{type:'string',description:'Person responsible'},due_date:{type:'string',description:'Due date YYYY-MM-DD'}},required:['title']}, config:{} },
  { name:'get_todays_meetings', kind:'builtin', description:'List today\'s meetings from the device calendar.',
    parameters:{type:'object',properties:{}}, config:{} },
  { name:'draft_email', kind:'builtin', description:'Draft a follow-up email in the device outbox for user review.',
    parameters:{type:'object',properties:{to:{type:'string'},subject:{type:'string'},body:{type:'string'}},required:['to','subject','body']}, config:{} },
  { name:'jira_search', kind:'http', description:'Search Jira issues by text. Requires network; degrades gracefully offline.',
    parameters:{type:'object',properties:{query:{type:'string',description:'Search text or JQL'}},required:['query']},
    config:{method:'GET', url:'https://YOUR-DOMAIN.atlassian.net/rest/api/3/search?jql=text~"{query}"', headers:{Authorization:'Basic <base64 email:api_token>'}} },
  { name:'confluence_search', kind:'http', description:'Search Confluence pages. Requires network; degrades gracefully offline.',
    parameters:{type:'object',properties:{query:{type:'string'}},required:['query']},
    config:{method:'GET', url:'https://YOUR-DOMAIN.atlassian.net/wiki/rest/api/search?cql=text~"{query}"', headers:{Authorization:'Basic <base64 email:api_token>'}} },
];

let state = { view:'agents', agent:null, tab:'details', catalog:[], adapters:[], onboard:null };

function nav(view) {
  state.view = view; state.agent = null;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
  render();
}

async function render() {
  const m = $('main');
  if (state.view === 'agents' && state.agent) return renderEditor();
  if (state.view === 'agents') {
    const agents = await api('/api/agents');
    m.innerHTML = `
      <div class="row"><div class="grow"><h1>Agents</h1>
      <div class="sub">Design task-specific agents that run fully offline on employee devices.</div></div>
      <button onclick="newAgent()">+ New Agent</button></div>
      ${agents.length ? `<div class="cards">${agents.map(a => `
        <div class="card" onclick="openAgent('${a.id}')">
          <h3>${esc(a.name)}</h3><p>${esc(a.description) || 'No description'}</p>
          <div class="meta">
            <span class="chip blue">${esc(a.model_id)}</span>
            <span class="chip">${a.kb.docs} docs · ${a.kb.chunks} chunks</span>
            <span class="chip">${a.tools} tools</span>
            ${a.version ? `<span class="chip green">published v${a.version}</span>` : '<span class="chip">draft</span>'}
          </div>
        </div>`).join('')}</div>`
      : `<div class="empty">No agents yet. Create your first agent — try the Meeting Intelligence scenario.</div>`}`;
  }
  if (state.view === 'published') {
    const pubs = await api('/api/published');
    m.innerHTML = `<h1>Published Bundles</h1>
      <div class="sub">Versioned agent bundles available for device download (manifest + knowledge base). Models are pulled separately and cached per device.</div>
      ${pubs.length ? `<div class="panel"><table><tr><th>Agent</th><th>Version</th><th>Bundle size</th><th>Model</th><th>KB</th><th>Published</th><th></th></tr>
      ${pubs.map(p => `<tr><td><b>${esc(p.name)}</b></td><td>v${p.version}</td>
        <td>${(p.bundle_bytes/1024).toFixed(0)} KB</td>
        <td>${esc(p.model.name)} (${p.model.size_gb} GB)</td>
        <td>${p.kb.docs} docs / ${p.kb.chunks} chunks</td><td>${p.published_at.slice(0,10)}</td>
        <td><a href="/bundles/${p.bundle}" style="color:var(--accent)">download</a></td></tr>`).join('')}
      </table></div>` : `<div class="empty">Nothing published yet.</div>`}`;
  }
  if (state.view === 'models') {
    const [cat, disk] = await Promise.all([api('/api/catalog'), api('/api/catalog/disk')]);
    const onServer = cat.filter(c => c.downloaded);
    const reclaimable = onServer.filter(c => c.can_delete_file && !c.usage.in_use);
    m.innerHTML = `<div class="row"><div class="grow"><h1>Model Catalog</h1>
        <div class="sub">SLMs that fit handheld devices (iPhone 14+ / Galaxy S23+ class, 4-bit GGUF quantization).</div></div>
        <button onclick="toggleOnboard()">${state.onboard ? 'Cancel' : '+ Onboard model'}</button>
      </div>
      <div id="onboard-panel"></div>
      <div class="panel" style="padding:14px 20px">
        <div class="row" style="font-size:12.5px;color:var(--muted)">
          <div class="grow"><b style="color:var(--text)">${gbytes(disk.models_bytes)}</b> in ${disk.model_files} model file${disk.model_files === 1 ? '' : 's'}
            · <b style="color:var(--text)">${gbytes(disk.free_bytes)}</b> free on this server</div>
          ${reclaimable.length
            ? `<span>${reclaimable.length} unused model${reclaimable.length === 1 ? '' : 's'} holding
                 ${gbytes(reclaimable.reduce((a, c) => a + c.file_bytes, 0))}</span>`
            : '<span>nothing unused on disk</span>'}
        </div>
      </div>
      <div class="panel"><table><tr><th>Model</th><th>Size</th><th>Min RAM</th><th>Context</th><th>Used by</th><th>Status</th><th style="text-align:right">Actions</th></tr>
      ${cat.map(c => `<tr><td><b>${esc(c.name)}</b>
          ${c.source === 'custom' ? '<span class="chip blue">onboarded</span>' : ''}
          ${c.loaded ? '<span class="chip green">loaded</span>' : ''}
          <br><span style="color:var(--muted);font-size:11.5px">${esc(c.notes)}</span></td>
        <td>${c.size_gb || '?'} GB</td><td>${c.min_device_ram_gb} GB</td><td>${(c.context_length/1024).toFixed(0)}k</td>
        <td style="font-size:12px">${usageLabel(c.usage)}</td>
        <td>${c.downloaded
              ? `<span class="chip green">on server</span><br><span style="color:var(--muted);font-size:11px">${gbytes(c.file_bytes)}</span>`
              : '<span class="chip">on demand</span>'}</td>
        <td style="text-align:right;white-space:nowrap">
          ${!c.downloaded && c.download_url ? `<button class="ghost small" onclick="cacheModel('${c.id}')">Cache here</button>` : ''}
          ${c.downloaded ? `<button class="danger-ghost small" ${c.loaded ? 'disabled title="loaded by llama-server right now"' : ''}
              onclick="deleteModelFile('${c.id}')">Delete file</button>` : ''}
          ${c.can_remove_entry ? `<button class="danger-ghost small" onclick="removeModel('${c.id}')">Remove</button>` : ''}
        </td></tr>`).join('')}
      </table>
      <div style="color:var(--muted);font-size:12px;margin-top:12px">
        Deleting a file frees disk but keeps the model in the catalogue — it reverts to "on demand"
        and is fetched again when an agent needs it. Removing drops an onboarded model entirely.
      </div>
      </div>`;
    if (state.onboard) renderOnboard();
  }
  if (state.view === 'governance') {
    await renderGovernance(m);
  }
}

const GOV_EVENT_ICONS = {
  install:'📥', chat:'💬', model_load:'⚙', error:'⚠', bundle_download:'📦',
  model_download:'🧠', apk_download:'📲',
};
let govDays = 30, govFilter = '';

function fmtBytes(b){ if(!b) return '0'; const u=['B','KB','MB','GB']; let i=0,n=b; while(n>=1024&&i<3){n/=1024;i++;} return n.toFixed(n<10&&i>0?1:0)+' '+u[i]; }
function fmtNum(n){ if(n==null) return '—'; if(n>=1e6) return (n/1e6).toFixed(1)+'M'; if(n>=1e3) return (n/1e3).toFixed(1)+'k'; return ''+n; }
function ago(ts){ if(!ts) return '—'; const d=(Date.now()-new Date(ts+'Z').getTime())/1000; if(d<60)return Math.floor(d)+'s ago'; if(d<3600)return Math.floor(d/60)+'m ago'; if(d<86400)return Math.floor(d/3600)+'h ago'; return Math.floor(d/86400)+'d ago'; }

function barChart(daily){
  if(!daily.length) return '<div class="empty">No activity in this window.</div>';
  const max = Math.max(1, ...daily.map(d => d.chats + d.installs));
  const w = 100 / daily.length;
  return `<div style="display:flex;align-items:flex-end;gap:2px;height:120px;padding:8px 0">
    ${daily.map(d => {
      const ch = 110 * d.chats / max, ins = 110 * d.installs / max;
      return `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1px" title="${d.day}: ${d.chats} chats, ${d.installs} installs, ${d.errors} errors">
        <div style="width:70%;background:var(--accent);height:${ch}px;border-radius:2px 2px 0 0"></div>
        <div style="width:70%;background:var(--accent2);height:${ins}px;border-radius:0 0 2px 2px"></div>
      </div>`;
    }).join('')}
  </div>
  <div style="display:flex;justify-content:space-between;color:var(--muted);font-size:10.5px">
    <span>${daily[0].day.slice(5)}</span><span>${daily[daily.length-1].day.slice(5)}</span></div>`;
}

function kpi(label, value, sub){
  return `<div class="card" style="cursor:default;padding:14px 16px">
    <div style="font-size:24px;font-weight:700;color:var(--text)">${value}</div>
    <div style="color:var(--muted);font-size:12px;margin-top:2px">${label}</div>
    ${sub?`<div style="color:var(--muted);font-size:11px;margin-top:4px">${sub}</div>`:''}
  </div>`;
}

async function renderGovernance(m){
  m.innerHTML = `<div class="row"><div class="grow"><h1>Governance</h1>
    <div class="sub">Usage, performance and reliability across Journey 2 and installed Android devices.
    <b style="color:var(--accent2)">Metadata only — no chat content, KB text, or queries are ever collected.</b></div></div>
    <select id="gov-days" onchange="govDays=+this.value;renderGovernance(document.getElementById('main'))" style="width:auto">
      <option value="1">Last 24h</option><option value="7">Last 7 days</option>
      <option value="30" selected>Last 30 days</option><option value="365">All time</option>
    </select></div>
    <div id="gov-body"><div class="empty"><span class="spinner"></span> Loading telemetry…</div></div>`;
  document.getElementById('gov-days').value = String(govDays);

  let ov;
  try { ov = await api('/api/governance/overview?days=' + govDays); }
  catch(e){ document.getElementById('gov-body').innerHTML = `<div class="empty">Telemetry unavailable: ${esc(e.message)}</div>`; return; }
  const s = ov.summary;
  const body = document.getElementById('gov-body');

  body.innerHTML = `
    <div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:16px">
      ${kpi('Chats', fmtNum(s.chats), s.tokens ? fmtNum(s.tokens)+' tokens generated' : '')}
      ${kpi('Installs', fmtNum(s.installs), s.devices+' active device'+(s.devices===1?'':'s'))}
      ${kpi('Avg speed', s.avg_tok_per_sec!=null? s.avg_tok_per_sec+' tok/s':'—', s.avg_load_ms? 'load '+(s.avg_load_ms/1000).toFixed(1)+'s':'')}
      ${kpi('Reliability', s.reliability_pct!=null? s.reliability_pct+'%':'—', s.errors+' error'+(s.errors===1?'':'s'))}
      ${kpi('Data served', fmtBytes(s.bytes_served), 'bundles + models + APK')}
    </div>

    <div class="panel"><h3>Activity — chats (blue) &amp; installs (green)</h3>${barChart(ov.daily)}</div>

    <div class="panel"><h3>Usage by agent</h3>
      ${ov.per_agent.length ? `<table><tr><th>Agent</th><th>Installs</th><th>Chats</th><th>Tokens</th><th>Avg tok/s</th><th>Avg KB hits</th><th>Errors</th><th>Last seen</th></tr>
        ${ov.per_agent.map(a=>`<tr><td><b>${esc(a.agent_id||'?')}</b></td><td>${a.installs}</td><td>${a.chats}</td>
          <td>${fmtNum(a.tokens)}</td><td>${a.avg_tps??'—'}</td><td>${a.avg_kb_hits??'—'}</td>
          <td>${a.errors?`<span style="color:var(--danger)">${a.errors}</span>`:'0'}</td><td style="color:var(--muted)">${ago(a.last_seen)}</td></tr>`).join('')}
      </table>` : '<div class="empty">No agent usage recorded yet.</div>'}
    </div>

    <div class="panel"><h3>Performance by model</h3>
      ${ov.per_model.length ? `<table><tr><th>Model</th><th>Chats</th><th>Avg tok/s</th><th>Avg load</th><th>Errors</th></tr>
        ${ov.per_model.map(x=>`<tr><td>${esc(x.model_id||'?')}</td><td>${x.chats}</td><td>${x.avg_tps??'—'}</td>
          <td>${x.avg_load_ms?(x.avg_load_ms/1000).toFixed(1)+'s':'—'}</td><td>${x.errors||0}</td></tr>`).join('')}
      </table>` : '<div class="empty">No model performance data yet.</div>'}
    </div>

    <div class="panel"><h3>Devices</h3>
      ${ov.devices.length ? `<table><tr><th>Device</th><th>Source</th><th>Installs</th><th>Chats</th><th>First seen</th><th>Last seen</th></tr>
        ${ov.devices.map(d=>`<tr><td><b>${esc(d.device_model||d.device_id)}</b><br><span style="color:var(--muted);font-size:10.5px">${esc(d.device_id)}</span></td>
          <td><span class="chip">${esc(d.source)}</span></td><td>${d.installs}</td><td>${d.chats}</td>

function adapterOptions(a) {
  const opts = [{ id:'', name:'Stock weights', size:0, score:null, pickable:true,
                  info:'No adapter. The model behaves exactly as published upstream.' }];
  for (const ad of (state.adapters || [])) {
    // an adapter is only valid on the base it was trained against — applying it
    // to another model produces garbage rather than an error, so the wrong ones
    // are not offered at all
    if (ad.base_model_id !== a.model_id || ad.status !== 'promoted') continue;
    opts.push({
      id: ad.id, name: ad.id, pickable: true,
      size: Math.round(ad.size_bytes / 1048576),
      score: ad.scorecard && ad.scorecard.score != null
        ? Math.round(ad.scorecard.score * 100) + '%' : null,
      info: `Trained for ${ad.agent}, promoted ${(ad.decided_at || '').slice(0, 10)}.`,
    });
  }
  if (opts.length === 1) {
    opts.push({ id:'__none__', name:'No promoted adapter for this model yet', pickable:false,
                size:0, score:null,
                info:'python -m finetune baseline / synth / pack → train on a GPU box → import → evaluate.' });
  }
  return opts;
}

    description: $('f-desc').value.trim(),
    scenario: $('f-scenario').value.trim(),
    system_prompt: $('f-prompt').value,
    model_id: a.model_id,
    adapter_id: a.adapter_id || '',
    generation: { temperature:+$('f-temp').value, top_p:+$('f-topp').value, max_tokens:+$('f-maxtok').value },
    rag: { top_k:+$('f-topk').value, min_score:+$('f-minscore').value },
    tools: a.tools || [],
  };

async function uploadFiles(files) {
  if (!files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append('files', f);
  $('upload-status').innerHTML = '<span class="spinner"></span>Chunking & embedding…';
  try {
    const res = await api(`/api/agents/${state.agent.id}/docs`, { method:'POST', body:fd });
    toast(`Indexed ${res.uploaded.length} file(s) — KB now ${res.stats.chunks} chunks`);
    renderEditor();
  } catch (e) { $('upload-status').textContent = ''; toast('Upload failed: ' + e.message, true); }
}

async function persistTools() {

async function addToolTemplate(i) {
  const t = JSON.parse(JSON.stringify(TOOL_TEMPLATES[i]));
  if ((state.agent.tools||[]).some(x => x.name === t.name)) return toast('Tool already attached', true);
  state.agent.tools = [...(state.agent.tools||[]), t];
  await persistTools(); toast('Tool added: ' + t.name); renderEditor();
}

async function addToolJson() {
  try {
    const t = JSON.parse($('tool-json').value);
    if (!t.name || !t.kind) throw new Error('name and kind are required');
    state.agent.tools = [...(state.agent.tools||[]), t];
    await persistTools(); toast('Tool added: ' + t.name); renderEditor();
  } catch (e) { toast('Invalid tool JSON: ' + e.message, true); }
}

async function removeTool(i) {
  state.agent.tools.splice(i, 1);

}

async function setVersionState(version, next) {
  const a = state.agent;
  if (next === 'disabled' &&
      !confirm(`Disable ${a.name} v${version}?\n\nIt leaves the store and any device running it stops. You can re-enable it later.`)) return;
  try {
    const res = await api(`/api/agents/${a.id}/versions/${version}/state`,
                          { method:'POST', json:{ state: next } });
    toast(res.published_version
      ? `v${version} ${next === 'active' ? 'enabled' : 'disabled'} — store now serves v${res.published_version}`
      : `v${version} disabled — nothing left in the store for this agent`);
    renderEditor();
  } catch (e) { toast('Failed: ' + e.message, true); }
}

async function deleteVersion(version) {
  const a = state.agent;
  if (!confirm(`Delete ${a.name} v${version}?\n\nIts bundle is removed from the server permanently. This cannot be undone.`)) return;
  try {
    const res = await api(`/api/agents/${a.id}/versions/${version}`, { method:'DELETE' });
    toast(res.published_version
      ? `v${version} deleted — store now serves v${res.published_version}`
      : `v${version} deleted — nothing left in the store for this agent`);
    renderEditor();
  } catch (e) { toast('Delete failed: ' + e.message, true); }
}

async function deleteAgent() {
  const a = state.agent;
  if (!confirm(`Delete the agent "${a.name}" entirely?\n\nEvery published bundle is removed from the server and it disappears from the store. This cannot be undone.`)) return;
  try {
    const res = await api(`/api/agents/${a.id}`, { method:'DELETE' });
    const n = (res.bundles_removed || []).length;
    toast(`Deleted ${a.name}${n ? ` and ${n} published bundle${n > 1 ? 's' : ''}` : ''}`);
    state.agent = null;
    render();
  } catch (e) { toast('Delete failed: ' + e.message, true); }
}

async function publishAgent() {
  try {
    const res = await api(`/api/agents/${state.agent.id}/publish`, { method:'POST' });
    toast(`Published ${res.bundle}`);
    state.agent = await api('/api/agents/' + state.agent.id);
    renderEditor();
  } catch (e) { toast('Publish failed: ' + e.message, true); }
}

          <div><label>License</label><input id="ob-lic" value="${esc(p.license)}"></div>
          <div><label>Upstream repo for fine-tuning (optional)</label><input id="ob-repo" value="${esc(p.hf_repo)}" placeholder="Qwen/Qwen3-0.6B"></div>
        </div>
        <div style="margin-top:10px;color:var(--muted);font-size:12px">
          <code>${esc(p.file)}</code> · ${p.size_gb} GB · ${esc(p.family)} architecture
          ${p.hf_repo ? '' : ' · no upstream repo set, so this model cannot be the base of a fine-tune'}
        </div>
        <div class="row" style="margin-top:12px">
          <button class="green" onclick="onboardAdd(false)" ${o.busy ? 'disabled' : ''}>Add to catalog</button>
          <button class="ghost" onclick="onboardAdd(true)" ${o.busy ? 'disabled' : ''}>Add and cache on server</button>
        </div>
      </div>` : ''}
    ` : `
      <label>Choose a .gguf file from this machine</label>
      <input type="file" id="ob-file" accept=".gguf" onchange="onboardUpload(this)">
      <div style="color:var(--muted);font-size:12px;margin-top:8px">
        Streamed straight to the model store. Devices fetch an uploaded model from this portal —
        there is no public CDN copy of it.
      </div>
      <div id="ob-progress" style="margin-top:10px"></div>
    `}
  </div>`;
}

function pickRepoFile(url) {
  state.onboard.url = url;
  state.onboard.repoFiles = null;
  onboardInspect();
}

async function onboardInspect() {
  const o = state.onboard;
  const raw = ($('ob-url')?.value || o.url || '').trim();
  if (!raw) return toast('Paste a Hugging Face URL first', true);
  o.url = raw; o.busy = true; o.preview = null; o.repoFiles = null; renderOnboard();
  try {
    if (!raw.toLowerCase().includes('.gguf')) {
      const d = await api('/api/catalog/hf-files?repo=' + encodeURIComponent(raw));
      if (!d.files.length) throw new Error('no .gguf files in that repo');
      o.repoFiles = d.files.map(f => ({ name: f, url: d.urls[f] }));
      toast(`${d.files.length} GGUF files found`);
    } else {
      const d = await api('/api/catalog/inspect', { method: 'POST', json: { url: raw } });
      o.preview = d.entry;
      if (d.already_in_catalog) toast('A model with this id is already in the catalog', true);
    }
  } catch (e) { toast('Inspect failed: ' + e.message, true); }
  o.busy = false; renderOnboard();
}

async function onboardAdd(downloadNow) {
  const o = state.onboard;
  o.busy = true; renderOnboard();
  try {
    const res = await api('/api/catalog/custom', { method: 'POST', json: {
      url: o.url,
      id: $('ob-id').value.trim(),
      name: $('ob-name').value.trim(),
      context_length: Number($('ob-ctx').value) || 0,
      min_device_ram_gb: Number($('ob-ram').value) || 0,
      license: $('ob-lic').value.trim(),
      hf_repo: $('ob-repo').value.trim(),
      download_now: !!downloadNow,
    }});
    toast(`Onboarded ${res.entry.name}${downloadNow ? ' — downloading to server' : ''}`);
    state.onboard = null;
    render();
    if (downloadNow) pollModelDownloads();
  } catch (e) { toast('Onboard failed: ' + e.message, true); o.busy = false; renderOnboard(); }
}

function onboardUpload(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const bar = $('ob-progress');
  const fd = new FormData();
  fd.append('file', file);
  // XHR rather than fetch: these files are gigabytes and fetch reports no
  // upload progress, which would leave the page looking frozen.
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/catalog/upload');
  xhr.upload.onprogress = (e) => {
    if (!e.lengthComputable) return;
    const pct = Math.round(e.loaded / e.total * 100);
    bar.innerHTML = `<div class="spinner"></div> Uploading ${esc(file.name)} — ${pct}%
      (${(e.loaded / 1e9).toFixed(2)} / ${(e.total / 1e9).toFixed(2)} GB)`;
  };
  xhr.onload = () => {
    if (xhr.status === 200) {
      const res = JSON.parse(xhr.responseText);
      toast(`Onboarded ${res.entry.name} from upload`);
      state.onboard = null; render();
    } else {
      let d; try { d = JSON.parse(xhr.responseText).detail; } catch { d = xhr.statusText; }
      bar.innerHTML = '';
      toast('Upload failed: ' + d, true);
    }
  };
  xhr.onerror = () => { bar.innerHTML = ''; toast('Upload failed — connection lost', true); };
  xhr.send(fd);
}

async function cacheModel(id) {
  try {
    const r = await api(`/api/catalog/${id}/download`, { method: 'POST' });
    toast(r.state === 'downloading' ? 'Downloading to server…' : 'Already on the server');
    if (r.state === 'downloading') pollModelDownloads();
  } catch (e) { toast('Download failed: ' + e.message, true); }
}

let modelPollTimer;
async function pollModelDownloads() {
  clearTimeout(modelPollTimer);
  const d = await api('/api/catalog/downloads').catch(() => ({}));
  for (const [f, p] of Object.entries(d)) {
    if (p.error) toast(`${f}: ${p.error}`, true);
  }
  const active = Object.entries(d).filter(([, p]) => !p.error && (!p.total || p.done < p.total));
  if (active.length) {
    const [f, p] = active[0];
    const pct = p.total ? Math.round(p.done / p.total * 100) : 0;
    toast(`Downloading ${f} — ${pct}%`);
    modelPollTimer = setTimeout(pollModelDownloads, 2000);
  } else if (state.view === 'models') {
    render();
  }
}

const gbytes = (n) => !n ? '0 GB'
  : n >= 1e9 ? (n / 1e9).toFixed(2) + ' GB' : Math.round(n / 1e6) + ' MB';

function usageLabel(u) {
  if (!u || !u.in_use) return '<span style="color:var(--accent2)">unused</span>';
  const bits = [];
  if (u.agents.length) bits.push(`${u.agents.length} agent${u.agents.length > 1 ? 's' : ''}`);
  if (u.bundles.length) bits.push(`${u.bundles.length} bundle${u.bundles.length > 1 ? 's' : ''}`);
  if (u.installed.length) bits.push(`${u.installed.length} installed`);
  const detail = (u.agents || []).join(', ');
  return `<span title="${esc(detail)}">${bits.join(' · ')}</span>`;
}

/** Free the disk space a model's GGUF occupies; the catalogue entry stays. */
async function deleteModelFile(id) {
  const c = (await api('/api/catalog')).find(x => x.id === id);
  if (!c) return toast('Model not found', true);
  if (!confirm(`Delete the GGUF for "${c.name}"?\n\nFrees ${gbytes(c.file_bytes)}. `
      + `It stays in the catalogue and is downloaded again when an agent needs it.`)) return;
  try {
    const r = await api(`/api/catalog/${id}/file`, { method: 'DELETE' });
    toast(`Freed ${gbytes(r.freed_bytes)} — ${c.name} is now on demand`);
    render();
  } catch (e) {
    // The server refuses an in-use model unless forced; relay its reason and
    // let the user decide, rather than silently retrying with force.
    if (/still used by/i.test(e.message)) {
      if (!confirm(`${e.message}\n\nDelete it anyway?`)) return;
      try {
        const r = await api(`/api/catalog/${id}/file?force=true`, { method: 'DELETE' });
        toast(`Freed ${gbytes(r.freed_bytes)} — will re-download when needed`);
        render();
      } catch (e2) { toast('Delete failed: ' + e2.message, true); }
    } else {
      toast('Delete failed: ' + e.message, true);
    }
  }
}

/** Drop an onboarded model from the catalogue, with its file. */
async function removeModel(id) {
  if (!confirm(`Remove "${id}" from the catalogue and delete its GGUF?\n\nThis cannot be undone.`)) return;
  try {
    const r = await api(`/api/catalog/custom/${id}?delete_file=true`, { method: 'DELETE' });
    toast(`Removed ${id}${r.file_deleted ? ` and freed ${gbytes(r.freed_bytes)}` : ''}`);
    render();
  } catch (e) {
    if (/still used by/i.test(e.message)) {
      if (!confirm(`${e.message}\n\nRemove anyway?`)) return;
      try {
        const r = await api(`/api/catalog/custom/${id}?delete_file=true&force=true`, { method: 'DELETE' });
        toast(`Removed ${id}${r.file_deleted ? ` and freed ${gbytes(r.freed_bytes)}` : ''}`);
        render();
      } catch (e2) { toast('Remove failed: ' + e2.message, true); }
    } else {
      toast('Remove failed: ' + e.message, true);
    }
  }
}

render();
</script>
</body>
</html>
